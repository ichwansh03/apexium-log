global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # No notification integration wired by default. Uncomment and edit one of
    # the examples below, or point this at Slack/PagerDuty/email.
    #
    # webhook_configs:
    #   - url: http://host.docker.internal:5001/alerts
    #     send_resolved: true
    #
    # slack_configs:
    #   - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    #     channel: '#apexium-alerts'
    #     send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
