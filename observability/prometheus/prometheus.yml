global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: apexium-local
    environment: docker

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: apexium-app
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['app:8080']
        labels:
          service: apexium-log
          environment: docker
